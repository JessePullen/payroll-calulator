<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" type="text/css" href="style.css" />
		<script src="script.js" defer></script>
		<title>Payroll Calculator</title>
	</head>
	<body>
		<div class="header">
			<h1>Payroll Calculator</h1>
		</div>
		<div class="container">
			<div class="calculator">
				<form>
					<div class="start">
						<label for="start-time">Start time:</label>
						<input type="text" id="start-time" />
					</div>
					<div class="radio-start">
						<label for="start-am">AM</label>
						<input type="radio" id="start-am" name="start-toggle" value="start-am" />
						<label for="start-pm">PM</label>
						<input type="radio" id="start-pm" name="start-toggle" value="start-pm" checked />
					</div>
					<div class="finish">
						<label>Finish time:</label>
						<input type="text" />
					</div>
					<div class="radio-finish">
						<label for="finish-am">AM</label>
						<input type="radio" id="finish-am" name="finish-toggle" value="finish-am" />
						<label for="finish-pm">PM</label>
						<input type="radio" id="finish-pm" name="finish-toggle" value="finish-pm" checked />
					</div>
					<button type="submit">Calculate</button>
				</form>
			</div>
		</div>
	</body>
</html>
